<!doctype html><html><head><meta charset="utf-8"><style>@import '/src/fonts.css';html,body{margin:0;background:#F4F5FA}canvas{position:fixed;inset:0;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { World } from '/src/world/World.ts';
const q=new URLSearchParams(location.search);
await Promise.all(['italic 300 100px Newsreader','400 100px Newsreader','400 20px Geist','600 20px Geist','400 20px "Geist Mono"'].map(f=>document.fonts.load(f)));
const w=new World(document.getElementById('c'),q.get('tier')||'high',{still:q.has('still')});
await w.init();if(q.has('water'))w.waterAmp=+q.get('water');w.setProgress(+(q.get('p')||0));
if(q.has('px'))w.setPointer(+q.get('px'),+q.get('py'));
w.setIntro(+(q.get('intro')||0));window.__w=w;
const N=+(q.get('n')||40);for(let i=0;i<N;i++){w.frame();}
if(q.has('dump'))w.debugAtlas();
requestAnimationFrame(()=>window.__done=true);
addEventListener('pointermove',e=>w.setPointer(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1)));
</script></body></html>
